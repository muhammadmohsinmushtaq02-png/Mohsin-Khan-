<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mohsin Khan — Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0B0E14;
    --asphalt: #23262E;
    --asphalt-dark: #1A1D24;
    --line: #F2C94C;
    --nitro: #B6FF3C;
    --danger: #FF4D4D;
    --hud: #EAEAF0;
    --hud-dim: #8A8FA3;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); }
  body{
    font-family:'Inter',sans-serif; color:var(--hud);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
    background:radial-gradient(1000px 700px at 50% -10%, rgba(182,255,60,0.06), transparent 60%), var(--bg);
  }
  .stage{
    position:relative; width:100%; max-width:460px; height:100vh; max-height:820px;
    overflow:hidden; box-shadow:0 30px 80px -30px rgba(0,0,0,0.8);
  }
  canvas{ display:block; width:100%; height:100%; background:var(--asphalt); }

  .hud{
    position:absolute; top:0; left:0; right:0; padding:16px 18px;
    display:flex; justify-content:space-between; align-items:flex-start;
    font-family:'Rajdhani',sans-serif; pointer-events:none;
  }
  .hud .block{ display:flex; flex-direction:column; }
  .hud .label{ font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--hud-dim); }
  .hud .value{ font-size:26px; font-weight:700; line-height:1.1; }
  .hud .value.nitro{ color:var(--nitro); }

  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; background:rgba(11,14,20,0.86); backdrop-filter:blur(2px);
    transition:opacity .2s ease;
  }
  .overlay.hidden{ display:none; }
  .badge{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:13px; letter-spacing:0.16em;
    text-transform:uppercase; color:var(--nitro); margin-bottom:10px;
  }
  .title{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:46px; line-height:1;
    margin:0 0 6px; color:var(--hud);
  }
  .title span{ color:var(--nitro); }
  .subtitle{ color:var(--hud-dim); font-size:14px; margin:0 0 28px; max-width:280px; line-height:1.6; }
  .score-line{ font-family:'Rajdhani',sans-serif; font-size:20px; margin-bottom:6px; }
  .score-line b{ color:var(--nitro); font-size:34px; display:block; }
  .best-line{ color:var(--hud-dim); font-size:13px; margin-bottom:26px; }

  button.play{
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:18px; letter-spacing:0.04em;
    background:var(--nitro); color:#0B1400; border:none; border-radius:10px;
    padding:14px 40px; cursor:pointer; text-transform:uppercase;
    box-shadow:0 10px 26px -10px rgba(182,255,60,0.5);
    transition:transform .12s ease;
  }
  button.play:active{ transform:scale(0.96); }

  .howto{ margin-top:22px; color:var(--hud-dim); font-size:12px; line-height:1.8; }
  .howto b{ color:var(--hud); }

  /* Touch controls */
  .touch-controls{
    position:absolute; bottom:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:0 14px 22px; pointer-events:none;
  }
  .touch-controls.hidden{ display:none; }
  .tc-btn{
    width:64px; height:64px; border-radius:16px; background:rgba(234,234,240,0.08);
    border:1px solid rgba(234,234,240,0.16); display:flex; align-items:center; justify-content:center;
    font-size:26px; color:var(--hud); pointer-events:auto;
  }
  .tc-btn:active{ background:rgba(182,255,60,0.22); border-color:var(--nitro); }
  .tc-side{ display:flex; gap:12px; }

  @media (min-width:700px){ .touch-controls{ display:none; } }
</style>
</head>
<body>
<div class="stage">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="block">
      <span class="label">Distance</span>
      <span class="value" id="hudScore">0m</span>
    </div>
    <div class="block" style="align-items:flex-end;">
      <span class="label">Nitro</span>
      <span class="value nitro" id="hudNitro">100%</span>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="badge">Night Highway · Endless</div>
    <h1 class="title">MOHSIN<br><span>KHAN</span> RACING</h1>
    <p class="subtitle">Dodge the traffic. Grab nitro. Go as far as you can before you crash.</p>
    <button class="play" id="startBtn">Start Race</button>
    <div class="howto">
      <b>Desktop:</b> ← → or A/D to steer, hold ↑/W to boost<br>
      <b>Mobile:</b> use the on-screen arrows below
    </div>
  </div>

  <div class="overlay hidden" id="overScreen">
    <div class="badge">Crashed</div>
    <div class="score-line">Distance<b id="finalScore">0m</b></div>
    <div class="best-line" id="bestLine">Best: 0m</div>
    <button class="play" id="retryBtn">Race Again</button>
  </div>

  <div class="touch-controls hidden" id="touchControls">
    <div class="tc-side">
      <div class="tc-btn" id="btnLeft">◀</div>
      <div class="tc-btn" id="btnRight">▶</div>
    </div>
    <div class="tc-btn" id="btnBoost">⚡</div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.querySelector('.stage');

function resize(){
  canvas.width = stage.clientWidth * devicePixelRatio;
  canvas.height = stage.clientHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W = stage.clientWidth; H = stage.clientHeight;
}
let W, H;
window.addEventListener('resize', resize);

const LANES = 3;
let laneWidth, roadLeft, roadRight;

function layoutRoad(){
  roadLeft = W * 0.08;
  roadRight = W * 0.92;
  laneWidth = (roadRight - roadLeft) / LANES;
}

const state = {
  running:false,
  playerLane:1,
  playerX:0,
  targetX:0,
  speed:260,
  baseSpeed:260,
  maxSpeed:620,
  distance:0,
  best:0,
  boosting:false,
  nitro:100,
  obstacles:[],
  particles:[],
  spawnTimer:0,
  roadOffset:0,
  shakeT:0,
};

function laneX(lane){ return roadLeft + laneWidth*lane + laneWidth/2; }

function resetGame(){
  state.running = true;
  state.playerLane = 1;
  state.playerX = laneX(1);
  state.targetX = state.playerX;
  state.speed = state.baseSpeed;
  state.distance = 0;
  state.boosting = false;
  state.nitro = 100;
  state.obstacles = [];
  state.particles = [];
  state.spawnTimer = 0;
  state.roadOffset = 0;
  state.shakeT = 0;
}

function carPath(cx, cy, w, h, color, glow){
  ctx.save();
  if(glow){
    ctx.shadowColor = glow;
    ctx.shadowBlur = 18;
  }
  const r = w*0.28;
  ctx.fillStyle = color;
  roundRect(cx - w/2, cy - h/2, w, h, r);
  ctx.fill();
  // windshield
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(11,14,20,0.55)';
  roundRect(cx - w*0.32, cy - h*0.12, w*0.64, h*0.4, r*0.5);
  ctx.fill();
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function spawnObstacle(){
  const lane = Math.floor(Math.random()*LANES);
  const colors = ['#FF4D4D','#4D9BFF','#FFA64D','#C24DFF'];
  const isNitro = Math.random() < 0.14;
  state.obstacles.push({
    lane, y:-80,
    w: laneWidth*0.5, h: 70,
    color: isNitro ? null : colors[Math.floor(Math.random()*colors.length)],
    nitroPack: isNitro
  });
}

function update(dt){
  if(!state.running) return;

  // difficulty ramp
  state.speed = Math.min(state.maxSpeed, state.baseSpeed + state.distance*0.35);
  const effSpeed = state.boosting && state.nitro > 0 ? state.speed*1.6 : state.speed;

  if(state.boosting && state.nitro > 0){
    state.nitro = Math.max(0, state.nitro - dt*28);
  } else {
    state.nitro = Math.min(100, state.nitro + dt*4);
  }

  state.distance += effSpeed * dt * 0.06;
  state.roadOffset = (state.roadOffset + effSpeed*dt) % 60;

  // steer toward target lane
  state.targetX = laneX(state.playerLane);
  state.playerX += (state.targetX - state.playerX) * Math.min(1, dt*10);

  // spawn
  state.spawnTimer -= dt;
  const spawnRate = Math.max(0.55, 1.3 - state.distance/1400);
  if(state.spawnTimer <= 0){
    spawnObstacle();
    state.spawnTimer = spawnRate;
  }

  // move obstacles
  const carH = H*0.11;
  const playerY = H*0.78;
  for(let i=state.obstacles.length-1; i>=0; i--){
    const o = state.obstacles[i];
    o.y += effSpeed * dt;
    if(o.y > H+100){ state.obstacles.splice(i,1); continue; }

    const ox = laneX(o.lane);
    const dx = Math.abs(ox - state.playerX);
    const dy = Math.abs(o.y - playerY);
    if(dx < laneWidth*0.42 && dy < carH*0.62){
      if(o.nitroPack){
        state.nitro = 100;
        state.particles.push({x:ox,y:o.y,t:0,color:'#B6FF3C'});
        state.obstacles.splice(i,1);
      } else {
        crash();
        return;
      }
    }
  }

  if(state.shakeT > 0) state.shakeT -= dt;
}

function crash(){
  state.running = false;
  state.best = Math.max(state.best, Math.floor(state.distance));
  document.getElementById('finalScore').textContent = Math.floor(state.distance) + 'm';
  document.getElementById('bestLine').textContent = 'Best: ' + state.best + 'm';
  document.getElementById('overScreen').classList.remove('hidden');
  document.getElementById('touchControls').classList.add('hidden');
}

function drawRoad(){
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--asphalt-dark');
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--asphalt');
  ctx.fillRect(roadLeft,0,roadRight-roadLeft,H);

  // lane dividers
  ctx.strokeStyle = '#F2C94C';
  ctx.lineWidth = 4;
  ctx.setLineDash([26,22]);
  ctx.lineDashOffset = -state.roadOffset;
  for(let i=1;i<LANES;i++){
    const x = roadLeft + laneWidth*i;
    ctx.beginPath();
    ctx.moveTo(x,0); ctx.lineTo(x,H);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // road edges
  ctx.strokeStyle = 'rgba(234,234,240,0.35)';
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(roadLeft,0); ctx.lineTo(roadLeft,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(roadRight,0); ctx.lineTo(roadRight,H); ctx.stroke();
}

function draw(){
  ctx.save();
  if(state.shakeT > 0){
    ctx.translate((Math.random()-0.5)*6, (Math.random()-0.5)*6);
  }
  drawRoad();

  // obstacles
  const carH = H*0.11, carW = laneWidth*0.62;
  state.obstacles.forEach(o => {
    const ox = laneX(o.lane);
    if(o.nitroPack){
      ctx.save();
      ctx.shadowColor = '#B6FF3C'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#B6FF3C';
      ctx.beginPath();
      ctx.arc(ox, o.y, carW*0.28, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#0B1400';
      ctx.font = "700 16px 'Rajdhani'";
      ctx.textAlign = 'center'; ctx.textBaseline='middle';
      ctx.fillText('N', ox, o.y+1);
      ctx.restore();
    } else {
      carPath(ox, o.y, carW, carH, o.color, null);
    }
  });

  // particles (nitro pickup pop)
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.t += 0.05;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1-p.t);
    ctx.strokeStyle = p.color; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(p.x,p.y,20+p.t*40,0,Math.PI*2); ctx.stroke();
    ctx.restore();
    if(p.t > 1) state.particles.splice(i,1);
  }

  // player
  if(state.running || state.playerX){
    const playerY = H*0.78;
    if(state.boosting && state.nitro > 0){
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#B6FF3C';
      ctx.beginPath();
      ctx.moveTo(state.playerX-8, playerY+carH*0.4);
      ctx.lineTo(state.playerX+8, playerY+carH*0.4);
      ctx.lineTo(state.playerX, playerY+carH*0.4+30+Math.random()*20);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    carPath(state.playerX, playerY, carW, carH, '#EAEAF0', state.boosting ? '#B6FF3C' : null);
  }

  ctx.restore();
}

let lastT = performance.now();
function loop(t){
  const dt = Math.min(0.033, (t-lastT)/1000);
  lastT = t;
  update(dt);
  draw();
  document.getElementById('hudScore').textContent = Math.floor(state.distance) + 'm';
  document.getElementById('hudNitro').textContent = Math.floor(state.nitro) + '%';
  requestAnimationFrame(loop);
}

// input
window.addEventListener('keydown', e => {
  if(!state.running) return;
  if(e.key === 'ArrowLeft' || e.key.toLowerCase()==='a'){ state.playerLane = Math.max(0, state.playerLane-1); }
  if(e.key === 'ArrowRight' || e.key.toLowerCase()==='d'){ state.playerLane = Math.min(LANES-1, state.playerLane+1); }
  if(e.key === 'ArrowUp' || e.key.toLowerCase()==='w'){ state.boosting = true; }
});
window.addEventListener('keyup', e => {
  if(e.key === 'ArrowUp' || e.key.toLowerCase()==='w'){ state.boosting = false; }
});

let touchStartX = null;
canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
canvas.addEventListener('touchend', e => {
  if(touchStartX===null || !state.running) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(dx > 30) state.playerLane = Math.min(LANES-1, state.playerLane+1);
  else if(dx < -30) state.playerLane = Math.max(0, state.playerLane-1);
  touchStartX = null;
});

document.getElementById('btnLeft').addEventListener('touchstart', e=>{ e.preventDefault(); if(state.running) state.playerLane = Math.max(0, state.playerLane-1); });
document.getElementById('btnRight').addEventListener('touchstart', e=>{ e.preventDefault(); if(state.running) state.playerLane = Math.min(LANES-1, state.playerLane+1); });
document.getElementById('btnBoost').addEventListener('touchstart', e=>{ e.preventDefault(); state.boosting = true; });
document.getElementById('btnBoost').addEventListener('touchend', e=>{ e.preventDefault(); state.boosting = false; });

function startGame(){
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('overScreen').classList.add('hidden');
  document.getElementById('touchControls').classList.remove('hidden');
  resetGame();
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

resize();
layoutRoad();
window.addEventListener('resize', layoutRoad);
state.playerX = laneX(1);
requestAnimationFrame(loop);
</script>
</body>
</html>
